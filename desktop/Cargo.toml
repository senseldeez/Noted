[package]
name = "noted"
version = "0.3.0"
edition = "2021"
description = "A minimal OLED markdown editor"
license = "MIT"
repository = "https://github.com/senseldeez/noted"
authors = ["senseldeez"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.37"
rfd = "0.16"
trash = "5"
opener = { version = "0.9", features = ["reveal"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
name = "noted"
maintainer = "senseldeez"
section = "editors"
assets = [
  ["target/release/noted", "usr/bin/", "755"],
  ["packaging/noted.desktop", "usr/share/applications/", "644"],
  ["assets/icon.png", "usr/share/icons/hicolor/1024x1024/apps/noted.png", "644"],
]
