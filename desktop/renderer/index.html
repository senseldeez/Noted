<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>Noted</title>
<style>
@font-face { font-family: "JetBrains Mono"; src: url(fonts/jetbrains_mono_regular.ttf); font-weight: 400; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/jetbrains_mono_medium.ttf); font-weight: 500; }
@font-face { font-family: "JetBrains Mono"; src: url(fonts/jetbrains_mono_bold.ttf); font-weight: 700; }
/* Layout: one app window centred on an OLED-black page; the window holds the same three screens as the phone app (grid, reader, editor) with desktop affordances layered on. */
:root {
  --black: #000; --white: #fff; --border: #333; --divider: #222; --pill: #161616; --toolbar: #1c1c1c;
  --text2: #d6d6d6; --text3: #b5b5b5; --muted: #8f8f8f; --syntax: #7a7a7a; --guide: #2e2e2e; --code: #0e0e0e;
  --surface: #111; --menu: #141414; --hover: #0b0b0b;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --line: 2px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--black); color: var(--white); font-family: var(--sans); font-size: 14px; margin: 0; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i .f { fill: currentColor; stroke: none; }

.intro { max-width: 1280px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; color: var(--muted); font-size: 13px; }
.intro b { color: var(--white); font-weight: 800; font-size: 15px; letter-spacing: -.2px; }
.intro kbd, .kbd { font-family: var(--mono); font-size: 11px; color: var(--text2); border: var(--line) solid var(--border); border-radius: 6px; padding: 0 5px; }

.window { height: 100vh; overflow: hidden; display: flex; flex-direction: column; position: relative; background: var(--black); }
.titlebar { height: 38px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0 150px 0 16px; user-select: none; -webkit-app-region: drag; }
.mac .titlebar { padding: 0 16px 0 84px; }
button, input, textarea, .menu, .pal { -webkit-app-region: no-drag; }
.titlebar .name { font-size: 12px; font-weight: 700; color: var(--muted); }
.titlebar .wc { width: 40px; height: 28px; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.titlebar .wc svg { width: 14px; height: 14px; }
.titlebar .wc:hover { background: var(--pill); color: var(--white); }
.stage { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.view.enter { animation: enter .22s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }

/* header */
.hdr { display: flex; align-items: center; gap: 4px; padding: 14px 18px 8px 10px; flex: none; min-height: 66px; }
.hdr.root { padding-left: 26px; }
.ibtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--white); position: relative; transition: background .12s, transform .12s; }
.ibtn:hover { background: var(--pill); }
.ibtn:active { transform: scale(.94); }
.ibtn.dim { color: var(--muted); }
.ibtn svg.sm { width: 19px; height: 19px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; overflow: hidden; white-space: nowrap; }
.crumbs .c { color: var(--muted); font-size: 15px; font-weight: 700; padding: 4px 6px; border-radius: 8px; }
.crumbs .c:hover { color: var(--white); background: var(--pill); }
.crumbs .sep { color: var(--border); font-weight: 800; }
.crumbs .cur { font-size: 28px; font-weight: 800; letter-spacing: -.5px; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.crumbs.sub .cur { font-size: 22px; }
.status { flex: 1; font-size: 12px; color: var(--muted); padding-left: 4px; }
.searchpill { height: 40px; border: var(--line) solid var(--border); border-radius: 20px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 12px; color: var(--muted); font-size: 13px; margin-right: 4px; min-width: 210px; transition: border-color .12s; }
.searchpill:hover { border-color: #555; color: var(--text2); }
.searchpill svg { width: 17px; height: 17px; }
.searchpill .kbd { margin-left: auto; }
.pillbtn { height: 40px; border-radius: 20px; padding: 0 18px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; transition: transform .12s, background .12s; }
.pillbtn.primary { background: var(--white); color: var(--black); }
.pillbtn.primary:hover { background: #e6e6e6; }
.pillbtn.ghost { border: var(--line) solid var(--border); }
.pillbtn.ghost:hover { border-color: #555; }
.pillbtn:active { transform: scale(.96); }
.pillbtn svg { width: 18px; height: 18px; }

/* grid */
.scroll { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #333 transparent; }
.gridwrap { position: relative; margin: 4px 22px 160px; }
.card { position: absolute; top: 0; left: 0; border: var(--line) solid var(--border); border-radius: 22px; padding: 14px; background: var(--black); cursor: default; user-select: none;
  transition: transform .28s cubic-bezier(.2,.8,.2,1), border-color .12s, background .12s, box-shadow .12s; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: #4a4a4a; }
.card.sel { border-color: var(--white); border-width: 2.5px; padding: 13.5px; }
.card.drag { transition: border-color .12s, background .12s; z-index: 5; background: var(--surface); border-color: var(--white); cursor: grabbing; }
.card .ct { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 800; line-height: 20px; }
.card .ct span { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .ct svg { width: 16px; height: 16px; }
.card .ct svg.pin { width: 14px; height: 14px; }
.card.folder { gap: 8px; }
.pv { display: flex; flex-direction: column; gap: 3px; font-size: 12px; line-height: 18px; color: var(--text3); }
.pv > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv .h { color: var(--white); font-weight: 700; white-space: normal; }
.pv .t { display: flex; align-items: center; gap: 8px; }
.pv .t i { width: 11px; height: 11px; border: 2px solid var(--muted); border-radius: 3px; flex: none; }
.pv .t.done { color: var(--muted); text-decoration: line-through; }
.pv .t.done i { background: var(--white); border-color: var(--white); }
.pv .r { height: 2px; background: var(--border); margin: 4px 0; }
.pv .b::before { content: "•"; margin-right: 6px; color: var(--muted); }
.card .meta { font-size: 11px; color: var(--muted); }
.ghostslot { position: absolute; top: 0; left: 0; border: 2px dashed #6a6a6a; border-radius: 22px; pointer-events: none; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.glabel { position: absolute; left: 6px; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); }
.gdiv { position: absolute; left: 4px; right: 4px; height: 2px; background: var(--divider); }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; line-height: 21px; }
.fab { position: absolute; right: 26px; bottom: 26px; width: 60px; height: 60px; border-radius: 30px; background: var(--white); color: var(--black); display: grid; place-items: center; transition: transform .18s cubic-bezier(.3,1.4,.5,1); z-index: 4; }
.fab:hover { transform: scale(1.06); }
.fab:active { transform: scale(.94); }
.fab svg { width: 26px; height: 26px; stroke-width: 2.6; }

.selbar { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 2px; padding: 5px; height: 56px; border-radius: 28px; background: var(--toolbar); z-index: 6; animation: up .26s cubic-bezier(.2,1.2,.4,1); }
@keyframes up { from { transform: translate(-50%, 30px); opacity: 0; } }
.selbar button { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 23px; font-size: 13px; font-weight: 700; }
.selbar button:hover { background: #2a2a2a; }
.selbar svg { width: 18px; height: 18px; }

/* reading + editing column */
.col { max-width: 760px; margin: 0 auto; padding: 8px 40px 140px 56px; position: relative; }
.ntitle { font-size: 30px; line-height: 36px; font-weight: 800; letter-spacing: -.5px; margin: 0 0 16px; text-wrap: balance; }
.reader { display: flex; flex-direction: column; gap: 14px; }
.reader p { margin: 0; font-size: 16px; line-height: 26px; color: var(--text2); }
.sec { display: flex; flex-direction: column; }
.sec > .hd { position: relative; cursor: pointer; }
.sec > .hd.nofold { cursor: text; }
.sec > .body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .22s ease, opacity .22s ease; }
.sec > .body > div { overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding-top: 14px; min-height: 0; margin-left: -44px; padding-left: 44px; }
.sec.closed > .body { grid-template-rows: 0fr; opacity: 0; }
.h1 { font-size: 24px; line-height: 30px; font-weight: 800; letter-spacing: -.4px; }
.h2 { font-size: 20px; line-height: 27px; font-weight: 800; }
.h3 { font-size: 18px; line-height: 25px; font-weight: 700; }
.h4 { font-size: 16px; line-height: 24px; font-weight: 700; color: var(--text2); }
.sec.lv2, .sec.lv3, .sec.lv4 { padding-top: 8px; }
.reader > .sec:first-child { padding-top: 0; }
.chev { position: absolute; left: -34px; top: 50%; margin-top: -14px; width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; color: var(--muted); transition: background .12s; }
.chev:hover { background: var(--pill); color: var(--white); }
.chev svg { width: 14px; height: 14px; stroke-width: 2.6; transition: transform .25s cubic-bezier(.3,1.3,.5,1); transform: rotate(90deg); }
.closed > .hd .chev svg, .chev.closed svg { transform: rotate(0); }
.closed > .hd .chev, .chev.closed { color: var(--white); }
.quote { border-left: 3px solid var(--white); border-radius: 2px; padding: 2px 0 2px 14px; font-style: italic; color: var(--text3); font-size: 16px; line-height: 26px; }
.codeblk { background: var(--code); border: var(--line) solid var(--guide); border-radius: 14px; padding: 14px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 20px; color: var(--text2); white-space: pre; }
.hr { height: 2px; background: var(--border); margin: 4px 0; }
code.ic { font-family: var(--mono); font-size: 13px; background: var(--guide); color: var(--white); padding: 1px 4px; border-radius: 4px; }
.reader a, .ln a { color: var(--white); }
s { color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 4px; }
.li > .row { display: flex; align-items: flex-start; }
.li.g > .row { margin-left: -10px; }
.li .lc { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 14px; color: var(--muted); }
.li .lc.on { cursor: pointer; }
.li .lc.on:hover { background: var(--pill); }
.li .lc svg { width: 14px; height: 14px; stroke-width: 2.6; transition: transform .25s cubic-bezier(.3,1.3,.5,1); transform: rotate(90deg); }
.li.closed > .row .lc svg { transform: rotate(0); }
.li.closed > .row .lc { color: var(--white); }
.mk { height: 28px; display: flex; align-items: center; flex: none; }
.dot { width: 5px; height: 5px; border-radius: 3px; background: var(--white); margin-right: 10px; }
.num { font-size: 15px; color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
.box { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--muted); margin-right: 10px; display: grid; place-items: center; cursor: pointer; transition: background .12s, border-color .12s; }
.box:hover { border-color: var(--white); }
.box.on { background: var(--white); border-color: var(--white); }
.box svg { width: 12px; height: 12px; stroke: var(--black); stroke-width: 3; }
.li .tx { padding-top: 3px; font-size: 16px; line-height: 22px; min-width: 0; }
.li .tx.done { color: var(--muted); text-decoration: line-through; }
.badge { font-size: 11px; color: var(--muted); border: var(--line) solid var(--border); border-radius: 10px; padding: 0 8px; margin-left: 10px; white-space: nowrap; vertical-align: 2px; }
.li > .kids { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease, opacity .2s; margin-left: 3px; }
.li.closed > .kids { grid-template-rows: 0fr; opacity: 0; }
.li > .kids > div { overflow: hidden; min-height: 0; border-left: 2px solid var(--guide); padding-left: 18px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.foot { margin-top: 22px; border-top: 2px solid var(--divider); padding-top: 10px; font-size: 11px; color: var(--muted); }

/* editor */
.lines { position: relative; }
.apill { position: absolute; left: -14px; right: -14px; top: 0; height: 28px; background: var(--pill); border-radius: 14px; transition: top .18s cubic-bezier(.2,.8,.2,1), height .18s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
.ln { position: relative; min-height: 28px; line-height: 28px; font-size: 16px; color: var(--text2); cursor: text; display: flex; align-items: flex-start; white-space: pre-wrap; word-break: break-word; }
.ln > .c { flex: 1; min-width: 0; }
.ln.k-heading { color: var(--white); font-weight: 800; }
.ln.k-heading.l1 { font-size: 22px; } .ln.k-heading.l2 { font-size: 19px; } .ln.k-heading.l3 { font-size: 17px; font-weight: 700; }
.ln.k-heading.l4, .ln.k-heading.l5, .ln.k-heading.l6 { font-size: 16px; font-weight: 700; }
.ln.k-bullet, .ln.k-number, .ln.k-task { color: var(--white); }
.ln .mk { height: 28px; }
.ln.k-task.done .c { color: var(--muted); text-decoration: line-through; }
.ln.k-quote .c { border-left: 3px solid var(--white); padding-left: 14px; font-style: italic; color: var(--text3); }
.ln.k-rule .c { display: flex; align-items: center; height: 28px; } .ln.k-rule .c::before { content: ""; flex: 1; height: 2px; background: var(--border); }
.ln.code { font-family: var(--mono); font-size: 13px; background: var(--code); color: var(--text2); padding: 0 10px; border-left: 2px solid var(--guide); border-right: 2px solid var(--guide); }
.ln.code.first { border-top: 2px solid var(--guide); border-radius: 12px 12px 0 0; }
.ln.code.last { border-bottom: 2px solid var(--guide); border-radius: 0 0 12px 12px; }
.ln.code.first.last { border-radius: 12px; }
.ln.k-fence .c { color: var(--syntax); }
.ln.active { color: var(--white); font-style: normal; }
.ln.active .c { border: 0 !important; padding-left: 0 !important; }
.ln.active.code { background: transparent; border-color: transparent; }
.ln .chev { left: -34px; top: 0; margin-top: 0; }
.ln textarea { all: unset; display: block; width: 100%; white-space: pre-wrap; word-break: break-word; font: inherit; line-height: 28px; color: var(--white); caret-color: var(--white); resize: none; overflow: hidden; }
.ln textarea::selection, .ln ::selection { background: #444; }
.tail { height: 240px; cursor: text; }
.toolbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; height: 52px; padding: 0 6px; border-radius: 26px; background: var(--toolbar); gap: 0; z-index: 4; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none; }
.tb { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 21px; color: var(--white); font-size: 17px; font-weight: 800; position: relative; transition: background .12s, transform .1s; }
.tb:hover { background: #2a2a2a; }
.tb:active { transform: scale(.92); }
.tb.on { background: var(--white); color: var(--black); }
.tb svg { width: 21px; height: 21px; stroke-width: 2.4; }
.tbsep { width: 2px; height: 22px; background: #2e2e2e; margin: 0 5px; flex: none; }
.tb.slash { font-family: var(--mono); font-size: 16px; width: auto; padding: 0 12px; gap: 6px; display: flex; font-weight: 700; }
.tb.slash span { font-family: var(--sans); font-size: 12px; color: var(--muted); font-weight: 600; }

/* tooltip */
.tip { position: fixed; z-index: 60; background: var(--white); color: var(--black); font-size: 12px; font-weight: 700; border-radius: 8px; padding: 5px 9px; pointer-events: none; white-space: nowrap; opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.tip .k { font-family: var(--mono); font-weight: 500; color: #555; margin-left: 6px; }

/* slash palette */
.pal { position: fixed; z-index: 50; width: 320px; background: var(--menu); border: var(--line) solid var(--border); border-radius: 18px; padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.7); animation: pop .14s cubic-bezier(.2,1.2,.4,1); transform-origin: top left; }
.pal.above { transform-origin: bottom left; }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
.pal .q { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px; border-bottom: 2px solid var(--divider); margin-bottom: 6px; }
.pal .q span { font-family: var(--mono); color: var(--muted); }
.pal .q input { all: unset; flex: 1; font-size: 14px; color: var(--white); }
.pal .ttl { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); padding: 6px 10px 6px; display: flex; }
.pal .ttl em { font-style: normal; margin-left: auto; letter-spacing: 0; font-weight: 600; font-family: var(--mono); color: var(--text3); }
.pal .list { max-height: 300px; overflow-y: auto; gap: 0; scrollbar-width: thin; scrollbar-color: #333 transparent; }
.pal .it { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 12px; cursor: pointer; }
.pal .it .ic { width: 32px; height: 32px; border-radius: 9px; border: var(--line) solid var(--border); display: grid; place-items: center; flex: none; font-weight: 800; font-size: 13px; }
.pal .it .ic svg { width: 18px; height: 18px; }
.pal .it .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
.pal .it .nm small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal .it .sy { font-family: var(--mono); font-size: 11px; color: var(--syntax); white-space: nowrap; }
.pal .it.on { background: var(--white); color: var(--black); }
.pal .it.on .ic { border-color: #ccc; }
.pal .it.on .nm small, .pal .it.on .sy { color: #555; }
.pal .none { padding: 12px 10px; font-size: 13px; color: var(--muted); }
.pal .ft { border-top: 2px solid var(--divider); margin-top: 6px; padding: 8px 10px 4px; font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* menus, dialogs, toast, search */
.menu { position: fixed; z-index: 40; min-width: 210px; background: var(--menu); border: var(--line) solid var(--border); border-radius: 16px; padding: 6px; animation: pop .12s ease-out; }
.menu button { display: flex; width: 100%; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; text-align: left; }
.menu button:hover, .menu button.on { background: #222; }
.menu button .k { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.menu button svg { width: 18px; height: 18px; }
.menu hr { border: 0; height: 2px; background: var(--divider); margin: 5px 4px; }
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: grid; place-items: center; animation: fade .15s; padding: 16px; }
@keyframes fade { from { opacity: 0; } }
.dlg { width: 380px; max-width: 100%; background: var(--surface); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; animation: pop .16s cubic-bezier(.2,1.2,.4,1); }
.dlg h3 { margin: 0; font-size: 16px; font-weight: 800; }
.dlg p { margin: 0; font-size: 13px; line-height: 20px; color: var(--text2); }
.dlg input { all: unset; border: var(--line) solid var(--border); border-radius: 14px; padding: 14px; font-size: 15px; }
.dlg input:focus { border-color: #666; }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; }
.dlg .fl { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.dlg .fl button { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 14px; font-size: 14px; text-align: left; }
.dlg .fl button:hover { background: #1c1c1c; }
.dlg .fl svg { width: 16px; height: 16px; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--white); color: var(--black); font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 20px; z-index: 70; animation: up .22s cubic-bezier(.2,1.2,.4,1); white-space: nowrap; }
.search { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.72); display: flex; justify-content: center; align-items: flex-start; padding: 70px 16px 16px; animation: fade .15s; }
.sbox { width: 620px; max-width: 100%; background: var(--surface); border: var(--line) solid var(--border); border-radius: 24px; overflow: hidden; animation: pop .16s cubic-bezier(.2,1.2,.4,1); }
.sbox .in { display: flex; gap: 12px; align-items: center; padding: 16px 18px; border-bottom: 2px solid var(--divider); color: var(--muted); }

  rename: [['M4 20h4L19 9l-4-4L4 16z'], ['M13 7l4 4']], block: [['M4 6h16M4 12h16M4 18h10']],

const icon = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[n].map(([d, f]) => `<path d="${d}"${f ? ' class="f"' : ''}/>`).join('')}</svg>`;

/* ---------- notes folder (loaded from disk by the main process) ---------- */
let items = {}, ROOT = null, SEP = '/', sig = '';
function ingest(node, parent) {
  const x = { id: node.path, type: node.type, name: parent ? node.name : 'Noted', file: node.file, parent, pinned: !!node.pinned, modified: node.mtime || Date.now() };
  if (node.type === 'folder') x.children = node.children.map(c => ingest(c, node.path)); else x.text = node.text;
  items[x.id] = x; return x.id;
}
const signature = t => JSON.stringify(t, (k, v) => k === 'text' ? v.length : v);
async function reload(redraw = true) {
  const t = await api.scan();
  const nsig = signature(t);
  if (redraw === 'ifChanged' && nsig === sig) return;
  sig = nsig; items = {}; ROOT = ingest(t, null); SEP = ROOT.includes('\\') ? '\\' : '/';
  if (!stack.length || stack[0].id !== ROOT) stack = [{ s: 'folder', id: ROOT }];
  stack = stack.filter(s => items[s.id]); if (!stack.length) stack = [{ s: 'folder', id: ROOT }];
  for (const k of [...selected]) if (!items[k]) selected.delete(k);

}
function remap(oldP, newP) {
  if (!newP) return;
  stack.forEach(s => { if (s.id === oldP || s.id.startsWith(oldP + SEP)) s.id = newP + s.id.slice(oldP.length); });
}
const folds = {}; // note path -> Set(heading raw), remembered between launches
const foldsFor = id => { if (!folds[id]) { let a = []; try { a = JSON.parse(localStorage.getItem('folds:' + id) || '[]'); } catch {} folds[id] = new Set(a); } return folds[id]; };
const saveFolds = id => { try { localStorage.setItem('folds:' + id, JSON.stringify([...foldsFor(id)])); } catch {} };

/* ---------- markdown classification (mirrors classifyLine) ---------- */
function classify(l) {
  let m;
  if (/^\s*```/.test(l)) return { kind: 'fence', pe: 0 };
  if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) return { kind: 'rule', pe: l.length };
  if ((m = l.match(/^(#{1,6})(\s+|$)/))) return { kind: 'heading', level: m[1].length, pe: m[0].length };
  if ((m = l.match(/^(\s*)([-*+])\s\[( |x|X)\](\s|$)/))) return { kind: 'task', ind: m[1].length, checked: m[3] !== ' ', pe: m[0].length, ms: m[1].length };

  if ((m = l.match(/^>\s?/))) return { kind: 'quote', pe: m[0].length };
  if (!l.trim()) return { kind: 'blank', pe: 0 };
  return { kind: 'para', pe: 0 };
}

/* inline: returns html plus map from visible char index -> raw index */
function inline(src, base = 0) {
  const out = []; // {ch, raw, tags}
  function walk(s, off, tags) {
    let i = 0;
    while (i < s.length) {
      const r = s.slice(i);
      let m;
      if ((m = r.match(/^`([^`]+)`/))) { push(m[1], off + i + 1, [...tags, 'code']); i += m[0].length; continue; }

      if ((m = r.match(/^~~(?=\S)(.*?\S)~~/))) { walk(m[1], off + i + 2, [...tags, 's']); i += m[0].length; continue; }
      if ((m = r.match(/^\*(?=\S)([^*]*?\S)\*/)) || ((i === 0 || /\W/.test(s[i - 1])) && (m = r.match(/^_(?=\S)([^_]*?\S)_(?!\w)/)))) { walk(m[1], off + i + 1, [...tags, 'i']); i += m[0].length; continue; }

const plain = s => s.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\*\*|__|~~|`|\*/g, '');

/* ---------- reader blocks ---------- */

/* ---------- navigation ---------- */
let stack = [];

const top = () => stack[stack.length - 1];

function render(anim = true) {

  stage.innerHTML = '';
  const v = document.createElement('div'); v.className = 'view' + (anim ? ' enter' : '');
  stage.appendChild(v);
  if (t.s === 'folder') renderFolder(v, t.id);
  else if (t.editing) renderEditor(v, items[t.id]);
  else renderRead(v, items[t.id]);
}

/* ---------- folder grid ---------- */
function renderFolder(v, fid) {
  const f = items[fid], isRoot = fid === ROOT, path = pathOf(fid);
  const sel = selected.size;
  v.innerHTML = `
    <div class="hdr${isRoot ? ' root' : ''}">
      ${sel ? `<div class="status" style="font-size:13px;color:var(--text3);padding-left:16px">${sel === 1 ? 'Drag to reorder' : sel + ' selected'}</div><button class="pillbtn primary" data-act="done">Done</button>` : `
      ${isRoot ? '' : `<button class="ibtn" data-act="back" data-tip="Back" data-k="Esc">${icon('back')}</button>`}
      <div class="crumbs${isRoot ? '' : ' sub'}">${path.slice(0, -1).map(p => `<button class="c" data-crumb="${p.id}">${esc(p.name)}</button><span class="sep">/</span>`).join('')}<span class="cur">${esc(f.name)}</span></div>
      <button class="searchpill" data-act="search">${icon('search')}<span class="lbl">Search all notes</span><span class="kbd">${MOD} F</span></button>
      <button class="ibtn" data-act="more" data-tip="More">${icon('more')}</button>`}
    </div>
    <div class="scroll"><div class="gridwrap"></div></div>
    ${sel ? '' : `<button class="fab" data-act="add" data-tip="New note or folder" data-k="${MOD} N">${icon('plus')}</button>`}
    ${sel ? `<div class="selbar">
      <button data-act="pin">${icon(selItems().every(x => x.pinned) ? 'pin' : 'pinF')}${selItems().every(x => x.pinned) ? 'Unpin' : 'Pin'}</button>

      ${sel === 1 ? `<button data-act="renameSel">${icon('rename')}Rename</button>` : ''}

  if (!f.children.length) { $('.scroll', v).outerHTML = `<div class="empty">Nothing here yet.<br>Press + or ${MOD}+N to write a note.</div>`; }

    const a = e.target.closest('[data-act]'); const c = e.target.closest('[data-crumb]');
    if (c) { gotoFolder(c.dataset.crumb); return; }
    if (!a) return;
    const act = a.dataset.act;

    if (act === 'done') { selected.clear(); render(false); }
    if (act === 'search') openSearch();
    if (act === 'more') menu(a, [['refresh', 'Refresh', () => reload().then(() => toast('Refreshed'))], ['folderO', 'Change notes folder', () => api.chooseRoot().then(r => { if (r) { stack = []; reload(); toast('Notes folder changed'); } })], ['import', 'Show in file manager', () => api.reveal(fid)], '-', ['keys', 'Keyboard shortcuts', shortcuts, '?']]);

    if (act === 'renameSel') renameDialog(selItems()[0]);

}
const selItems = () => [...selected].map(k => items[k]).filter(Boolean);
function addMenu(anchor) {
  const fid = top().id;
  menu(anchor, [['note', 'New note', () => newNote(fid), `${MOD} N`], ['folderO', 'New folder', () => newFolder(fid), `${MOD} ⇧ N`], ['import', 'Import .md files', () => $('#importer').click()]], true);
}

function previewHTML(n) {

  while (all.length && !all[0].trim()) all.shift();

  all = all.filter(l => { if (/^\s*```/.test(l)) { inF = !inF; return false; } return l.trim() && !inF; }).slice(0, 8);
  return all.map(l => {
    const c = classify(l), txt = inline(l.slice(c.pe)).html;
    const pad = c.ind ? `style="padding-left:${Math.floor(c.ind / 2) * 10}px"` : '';
    if (c.kind === 'task') return `<div class="t${c.checked ? ' done' : ''}" ${pad}><i></i><span>${txt}</span></div>`;
    if (c.kind === 'heading') return `<div class="h">${txt}</div>`;

  m.textContent = t.value.slice(0, p.start); const s = document.createElement('span'); s.textContent = '/'; m.appendChild(s); document.body.appendChild(m);
  const sr = s.getBoundingClientRect(); m.remove();
  const ph = p.el.offsetHeight, pw = p.el.offsetWidth, wr = win.getBoundingClientRect();
  let x = Math.min(sr.left - 12, wr.right - pw - 12), y = sr.bottom + 8;
  p.el.classList.remove('above');
  if (y + ph > wr.bottom - 10) { y = sr.top - ph - 8; p.el.classList.add('above'); }
  p.el.style.left = Math.max(wr.left + 8, x) + 'px'; p.el.style.top = Math.max(8, y) + 'px';
}
function paletteKey(e) {
  const p = E.pal; if (!p) return false;
  const n = p.list.length;
  if (e.key === 'Tab' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!n) return false; e.preventDefault();
    const dir = (e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey)) ? -1 : 1;
    p.sel = (p.sel + dir + n) % n; paintSel(true); return true;
  }
  if (e.key === 'Enter') { if (!n) return false; e.preventDefault(); choose(); return true; }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); const im = p.inputMode; closePalette(); if (im) focusActive(); return true; }
  return false;
}
function choose() {
  const p = E.pal, c = p.list[p.sel]; if (!c) return;
  const t = E.ta;
  if (!p.inputMode) { // remove "/query", recording the literal text first so undo brings it back
    pushHist(true);
    const end = t.selectionStart; t.value = t.value.slice(0, p.start) + t.value.slice(end); E.lines[E.active] = t.value; t.setSelectionRange(p.start, p.start);
    closePalette(); runCmd(c.id, false, true);
  } else { closePalette(); t.focus(); t.setSelectionRange(p.start, p.end); pushHist(true); runCmd(c.id, false, true); }
}
function closePalette() { if (E && E.pal) { E.pal.el.remove(); E.pal = null; } }

/* ---------- dialogs, menus, toast ---------- */
let menuEl = null;
function menu(anchor, entries, up) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = entries.map((x, i) => x === '-' ? '<hr>' : `<button role="menuitem" data-i="${i}">${icon(x[0])}${x[1]}${x[3] ? `<span class="k">${x[3]}</span>` : ''}</button>`).join('');
  document.body.appendChild(m); menuEl = m;
  const w = m.offsetWidth, h = m.offsetHeight;
  let x, y;
  if (anchor instanceof Element) { const r = anchor.getBoundingClientRect(); x = r.right - w; y = up ? r.top - h - 8 : r.bottom + 6; }
  else { x = anchor.x; y = anchor.y; if (x + w > innerWidth - 8) x = innerWidth - w - 8; if (y + h > innerHeight - 8) y = innerHeight - h - 8; }
  m.style.left = Math.max(8, x) + 'px'; m.style.top = Math.max(8, y) + 'px';
  m.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; closeMenu(); entries[+b.dataset.i][2](); });
  m.querySelector('button').focus();
  m.addEventListener('keydown', e => { const bs = [...m.querySelectorAll('button')], i = bs.indexOf(document.activeElement); if (e.key === 'ArrowDown') { e.preventDefault(); bs[(i + 1) % bs.length].focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); bs[(i - 1 + bs.length) % bs.length].focus(); } });
}
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
document.addEventListener('mousedown', e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });

let dlgEl = null;
function dialog(html, onMount) {
  closeDialog();
  const s = document.createElement('div'); s.className = 'scrim'; s.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;
  win.appendChild(s); dlgEl = s;
  s.addEventListener('mousedown', e => { if (e.target === s) closeDialog(); });
  onMount && onMount(s);
}
function closeDialog() { if (dlgEl) { dlgEl.remove(); dlgEl = null; } }
function nameDialog(title, initial, confirm, fn) {
  dialog(`<h3>${title}</h3><input id="nm" value="${esc(initial)}" aria-label="Name"><div class="acts"><button class="pillbtn ghost" data-x>Cancel</button><button class="pillbtn primary" data-ok>${confirm}</button></div>`, s => {
    const i = $('#nm', s); i.focus(); i.select();
    const ok = () => { const v = i.value.trim(); if (v) { closeDialog(); fn(v); } };
    $('[data-ok]', s).onclick = ok; $('[data-x]', s).onclick = closeDialog;
    i.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') { e.stopPropagation(); closeDialog(); } });
  });
}
function newNote(fid) { nameDialog('New note', '', 'Create', name => api.createNote(fid, name).then(p => reload(false).then(() => go({ s: 'note', id: p, editing: true })))); }
function newFolder(fid) { nameDialog('New folder', '', 'Create', name => api.createFolder(fid, name).then(() => reload()).then(() => toast('Folder created'))); }
function renameDialog(x) {
  nameDialog('Rename', x.name, 'Rename', name => api.rename(x.id, name).then(np => {
    if (!np) return toast('Something with that name already exists');
    remap(x.id, np); selected.clear(); reload();
  }));
}
function confirmDialog(title, body, confirm, fn) {
  dialog(`<h3>${title}</h3><p>${body}</p><div class="acts"><button class="pillbtn ghost" data-x>Cancel</button><button class="pillbtn primary" data-ok>${confirm}</button></div>`, s => {
    $('[data-ok]', s).onclick = () => { closeDialog(); fn(); }; $('[data-x]', s).onclick = closeDialog; $('[data-ok]', s).focus();
  });
}
function deleteDialog(list, fromNote) {
  const folders = list.filter(x => x.type === 'folder').length;
  const body = list.length === 1 ? (folders ? `“${esc(list[0].name)}” and everything inside it will be moved to the trash.` : `“${esc(list[0].name)}” will be moved to the trash.`) : `${list.length} items will be moved to the trash${folders ? ', including everything inside the folders.' : '.'}`;
  confirmDialog('Delete?', body, 'Delete', () => {
    api.trash(list.map(x => x.id)).then(n => {
      selected.clear(); if (fromNote) stack.pop(); reload();
      toast(n === list.length ? (n === 1 ? 'Moved to trash' : `Moved ${n} items to trash`) : `Couldn't delete ${list.length - n} of ${list.length}`);
    });
  });
}
function moveDialog(list) {
  const ex = new Set(list.map(x => x.id));
  const rows = []; (function walk(fid, d) { const f = items[fid]; let blocked = false; let p = f; while (p) { if (ex.has(p.id)) blocked = true; p = items[p.parent]; } if (!blocked && !list.every(x => x.parent === fid)) rows.push([f, d]); f.children.forEach(k => { if (items[k].type === 'folder') walk(k, d + 1); }); })(ROOT, 0);
  dialog(`<h3>Move to</h3><div class="fl">${rows.length ? rows.map(([f, d]) => `<button data-f="${f.id}" style="padding-left:${12 + d * 16}px">${icon('folder')}${f.id === ROOT ? 'Noted (top level)' : esc(f.name)}</button>`).join('') : '<p style="color:var(--muted)">No other folders yet.</p>'}</div><div class="acts"><button class="pillbtn ghost" data-x>Cancel</button></div>`, s => {
    $('[data-x]', s).onclick = closeDialog;
    s.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
      const dest = b.dataset.f, label = dest === ROOT ? 'Noted' : items[dest].name; closeDialog();
      api.move(list.map(x => x.id), dest).then(map => { Object.entries(map).forEach(([o, nw]) => remap(o, nw)); selected.clear(); reload(); toast(`Moved to ${label}`); });
    });
  });
}
function shortcuts() {
  const rows = [['Search all notes', `${MOD} F`], ['New note', `${MOD} N`], ['New folder', `${MOD} ⇧ N`], ['Edit / back to reading', `E · ${MOD} E`], ['Back', 'Esc'], ['Formatting menu', `/ or ${MOD} /`], ['Bold · Italic · Link', `${MOD} B · I · K`], ['Headings 1–3', `${MOD} ⌥ 1–3`], ['Bullet · Numbered · Checkbox', `${MOD} ⇧ 8 · 7 · 9`], ['Indent · Outdent', 'Tab · ⇧ Tab'], ['Undo · Redo', `${MOD} Z · ${MOD} ⇧ Z`], ['Select several cards', `${MOD} click`], ['Rename · Delete card', 'F2 · Del']];
  dialog(`<h3>Keyboard shortcuts</h3><div class="keys">${rows.map(r => `<span>${r[0]}</span><span><span class="kbd">${r[1]}</span></span>`).join('')}</div><div class="acts"><button class="pillbtn primary" data-x>Done</button></div>`, s => { $('[data-x]', s).onclick = closeDialog; $('[data-x]', s).focus(); });
}
let toastT;
function toast(msg) { $('.toast', win)?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; win.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }

/* ---------- search ---------- */
let searchEl = null;
function openSearch() {
  closeAll();
  const s = document.createElement('div'); s.className = 'search';
  s.innerHTML = `<div class="sbox"><div class="in">${icon('search')}<input id="sq" placeholder="Search all notes" autocomplete="off"><span class="kbd">Esc</span></div><div class="res"></div></div>`;
  win.appendChild(s); searchEl = s;
  const q = $('#sq', s), res = $('.res', s); let sel = 0, hits = [];
  const draw = () => {
    const v = q.value.trim().toLowerCase();
    hits = Object.values(items).filter(x => x.type === 'note' && (!v || x.name.toLowerCase().includes(v) || x.text.toLowerCase().includes(v))).sort((a, b) => b.modified - a.modified).slice(0, 30);
    sel = Math.min(sel, Math.max(0, hits.length - 1));
    const hl = t => v ? esc(t).replace(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`) : esc(t);
    res.innerHTML = hits.length ? hits.map((x, i) => {
      const line = (v && x.text.split('\n').find(l => l.toLowerCase().includes(v))) || x.text.split('\n').find(l => l.trim() && !/^#\s/.test(l)) || '';
      const fp = pathOf(x.parent).slice(1).map(f => f.name).join('/');
      return `<div class="r${i === sel ? ' on' : ''}" data-i="${i}">${fp ? `<span class="f">${esc(fp)}/</span>` : ''}<span class="t">${hl(x.name)}</span><span class="s">${hl(plain(line.replace(/^\s*([-*+]\s(\[.\]\s)?|\d+[.)]\s|>\s?|#+\s)/, '')))}</span></div>`;
    }).join('') : '<div class="no">No matches.</div>';
  };
  draw(); q.focus();
  q.addEventListener('input', () => { sel = 0; draw(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); draw(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); }
    if (e.key === 'Enter' && hits[sel]) { const h = hits[sel]; closeSearch(); go({ s: 'note', id: h.id, editing: false }); }
    if (e.key === 'Escape') { e.stopPropagation(); closeSearch(); }
  });
  res.addEventListener('click', e => { const r = e.target.closest('.r'); if (r) { const h = hits[+r.dataset.i]; closeSearch(); go({ s: 'note', id: h.id, editing: false }); } });
  s.addEventListener('mousedown', e => { if (e.target === s) closeSearch(); });
}
function closeSearch() { if (searchEl) { searchEl.remove(); searchEl = null; } }
function closeAll() { closeMenu(); closeDialog(); closeSearch(); if (E) closePalette(); }

/* ---------- import ---------- */
async function importFiles(files) {
  const fid = top().s === 'folder' ? top().id : items[top().id].parent;
  const list = await Promise.all([...files].map(async f => ({ name: f.name, text: /\.(md|markdown)$/i.test(f.name) ? await f.text() : '' })));
  const { ok, skipped } = await api.import(fid, list);
  await reload(top().s === 'folder');
  toast((ok === 1 ? 'Imported 1 note' : `Imported ${ok} notes`) + (skipped ? ` · skipped ${skipped} (not .md)` : ''));
}
$('#importer').addEventListener('change', e => { if (e.target.files.length) importFiles(e.target.files); e.target.value = ''; });
let dropEl = null;
win.addEventListener('dragover', e => { if (![...e.dataTransfer.types].includes('Files')) return; e.preventDefault(); if (!dropEl) { dropEl = document.createElement('div'); dropEl.className = 'drop'; dropEl.textContent = 'Drop .md files to import'; win.appendChild(dropEl); } });
win.addEventListener('dragleave', e => { if (e.target === win || !win.contains(e.relatedTarget)) { dropEl?.remove(); dropEl = null; } });
win.addEventListener('drop', e => { e.preventDefault(); dropEl?.remove(); dropEl = null; if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files); });

/* ---------- tooltips ---------- */
const tip = $('#tip'); let tipT;
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]'); clearTimeout(tipT);
  if (!el) return hideTip();
  tipT = setTimeout(() => {
    tip.innerHTML = esc(el.dataset.tip) + (el.dataset.k ? `<span class="k">${esc(el.dataset.k)}</span>` : '');
    const r = el.getBoundingClientRect(); tip.classList.add('on');
    const w = tip.offsetWidth; let y = r.bottom + 8; if (el.closest('.toolbar,.fab')) y = r.top - tip.offsetHeight - 8;
    tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2)) + 'px'; tip.style.top = y + 'px';
  }, 380);
});
function hideTip() { tip.classList.remove('on'); }

/* ---------- global keys ---------- */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  const typing = e.target.matches('input, textarea');
  if (mod && k === 'f') { e.preventDefault(); if (E && top().editing) save(); return openSearch(); }
  if (mod && k === 'k' && !(top().editing)) { e.preventDefault(); return openSearch(); }
  if (mod && k === 'n') { e.preventDefault(); const t = top(); const fid = t.s === 'folder' ? t.id : items[t.id].parent; if (E && t.editing) save(); return e.shiftKey ? newFolder(fid) : newNote(fid); }
  if (typing) return;
  if (dlgEl || searchEl) { if (e.key === 'Escape') { closeDialog(); closeSearch(); } return; }
  if (menuEl && e.key === 'Escape') return closeMenu();
  const t = top();
  if (e.key === 'Escape' || (e.altKey && e.key === 'ArrowLeft')) { e.preventDefault(); return back(); }
  if (t.s === 'note' && !t.editing && (k === 'e' || (mod && k === 'e') || e.key === 'Enter')) { e.preventDefault(); return edit(items[t.id]); }
  if (e.key === '?') return shortcuts();
});

window.addEventListener('beforeunload', () => { if (E && E.ta && E.ta.isConnected) { E.lines[E.active] = E.ta.value; const t = E.lines.join('\n') + '\n'; if (t !== E.n.text) api.writeSync(E.n.id, t); } });
api.onFocus(() => { const t = top(); if (t && !t.editing && !dlgEl && !searchEl && !menuEl && !(G && G.drag)) reload('ifChanged'); });
reload();
})();
</script>
